<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SplitIt</title>
  <meta name="description" content="Split a restaurant bill with friends: scan, claim items, tip, pay.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SplitIt">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button id="back" class="icon-btn" aria-label="Back" hidden>‹</button>
    <h1 id="title">SplitIt</h1>
    <span class="spacer"></span>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="bill" class="active">🧾<span>Bill</span></button>
    <button data-tab="friends">👥<span>Friends</span></button>
    <button data-tab="settings">⚙️<span>Settings</span></button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
